services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mineportal}
      POSTGRES_USER: ${DB_USER:-mineportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mineportal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mineportal} -d ${DB_NAME:-mineportal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./nmp-cache:/app/nmp-cache

volumes:
  pgdata:
