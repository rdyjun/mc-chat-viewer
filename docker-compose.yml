services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mineportal}
      POSTGRES_USER: ${DB_USER:-mineportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mineportal}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mineportal} -d ${DB_NAME:-mineportal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: mineportal
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./nmp-cache:/app/nmp-cache

volumes:
  pgdata:
