<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>MC Chat Viewer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #eee; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.1rem; margin-bottom: 1rem; }
  h2 { font-size: 0.95rem; color: #ccc; margin: 0 0 0.5rem; }
  .layout { display: flex; gap: 1.5rem; align-items: flex-start; }
  .panel { background: #262626; border-radius: 8px; padding: 1rem; }
  .sidebar { width: 280px; display: flex; flex-direction: column; gap: 1rem; }
  input { padding: 0.4rem; border-radius: 4px; border: 1px solid #444; background: #333; color: #eee; width: 100%; box-sizing: border-box; }
  button { padding: 0.45rem 0.7rem; border-radius: 4px; border: none; background: #4a7; color: #111; font-weight: bold; cursor: pointer; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  #accountForm { display: flex; flex-direction: column; gap: 0.5rem; }
  #accountStatus { font-size: 0.85rem; margin-bottom: 0.4rem; }
  #msaCode { background: #443; border: 1px solid #a90; padding: 0.6rem; border-radius: 6px; margin-top: 0.5rem; font-size: 0.85rem; }
  #msaCode a { color: #fd6; }
  #addServerForm { display: flex; flex-direction: column; gap: 0.5rem; }
  #serverList { list-style: none; padding: 0; margin: 0.5rem 0 0; display: flex; flex-direction: column; gap: 0.4rem; }
  #serverList li { padding: 0.5rem; border-radius: 6px; background: #333; font-size: 0.85rem; }
  #serverList li.selected { outline: 2px solid #4a7; }
  .server-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .server-meta { cursor: pointer; }
  .server-status { color: #9ad; font-size: 0.75rem; }
  #chatPanel { flex: 1; }
  #chatStatus { color: #9ad; font-size: 0.85rem; margin-bottom: 0.5rem; }
  #statusLog { height: 8rem; overflow-y: auto; background: #1a1a1a; border-radius: 6px; padding: 0.4rem 0.6rem; margin-bottom: 0.75rem; font-family: monospace; font-size: 0.78rem; }
  #statusLog .line { border-bottom: none; color: #8c8; padding: 0.1rem 0; }
  #log { height: 50vh; overflow-y: auto; }
  .line { padding: 0.2rem 0; border-bottom: 1px solid #333; font-size: 0.9rem; word-break: break-word; }
  .time { color: #888; font-size: 0.8rem; margin-right: 0.5rem; }
</style>
</head>
<body>
  <h1>Minecraft Chat Viewer</h1>
  <div class="layout">
    <div class="sidebar">
      <div class="panel">
        <h2>계정</h2>
        <div id="accountStatus">확인 중...</div>
        <form id="accountForm">
          <input name="email" placeholder="Microsoft 계정 이메일" required />
          <button type="submit">로그인</button>
        </form>
        <div id="msaCode" style="display:none"></div>
      </div>

      <div class="panel">
        <h2>서버 추가</h2>
        <form id="addServerForm">
          <input name="host" placeholder="서버 주소" required />
          <input name="port" placeholder="포트 (기본 25565)" />
          <input name="version" placeholder="버전 (예: 26.1.2 또는 775)" required />
          <button type="submit">추가</button>
        </form>
        <h2 style="margin-top:1rem">서버 목록</h2>
        <ul id="serverList"></ul>
      </div>
    </div>

    <div class="panel" id="chatPanel">
      <div id="chatStatus">서버를 추가하고 연결해보세요.</div>
      <h2>연결 로그</h2>
      <div id="statusLog"></div>
      <h2>채팅</h2>
      <div id="log"></div>
      <form id="chatForm" style="display:flex; gap:0.5rem; margin-top:0.75rem;">
        <input name="message" placeholder="채팅 입력 (서명 안 된 메시지라 secure chat 강제 서버에서는 안 될 수 있음)" style="flex:1" />
        <button type="submit">전송</button>
      </form>
    </div>
  </div>

  <script>
    const accountForm = document.getElementById("accountForm");
    const accountStatusEl = document.getElementById("accountStatus");
    const msaCodeEl = document.getElementById("msaCode");
    const addServerForm = document.getElementById("addServerForm");
    const serverListEl = document.getElementById("serverList");
    const chatStatusEl = document.getElementById("chatStatus");
    const chatForm = document.getElementById("chatForm");
    const logEl = document.getElementById("log");
    const statusLogEl = document.getElementById("statusLog");

    let account = { status: "logged-out", msaCode: null };
    let servers = [];
    let selectedServerId = null;

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function renderAccount() {
      if (account.status === "logged-in") {
        accountStatusEl.textContent = "✅ " + account.profile.name + " 로그인됨";
        accountForm.style.display = "none";
      } else if (account.status === "logging-in") {
        accountStatusEl.textContent = "로그인 진행 중 (" + account.email + ")";
        accountForm.style.display = "none";
      } else if (account.status === "error") {
        accountStatusEl.textContent = "로그인 실패: " + account.error;
        accountForm.style.display = "";
      } else {
        accountStatusEl.textContent = "로그인이 필요합니다.";
        accountForm.style.display = "";
      }

      if (account.msaCode) {
        msaCodeEl.style.display = "block";
        msaCodeEl.innerHTML =
          "<a href='" + account.msaCode.verification_uri + "' target='_blank'>" +
          account.msaCode.verification_uri + "</a> 에서 코드 <b>" + account.msaCode.user_code + "</b> 입력";
      } else {
        msaCodeEl.style.display = "none";
      }
    }

    function renderServers() {
      serverListEl.innerHTML = "";
      servers.forEach((s) => {
        const li = document.createElement("li");
        li.className = s.id === selectedServerId ? "selected" : "";
        const canConnect = s.phase !== "active";
        const label = canConnect ? "연결" : (s.connected ? "연결됨" : "연결중");
        li.innerHTML =
          '<div class="server-row">' +
          '<span class="server-meta">' + escapeHtml(s.host) + ':' + s.port + '</span>' +
          '<button ' + (canConnect ? "" : "disabled") + '>' + label + '</button>' +
          '</div>' +
          '<div class="server-status">' + escapeHtml(s.status) + '</div>';

        li.querySelector(".server-meta").onclick = () => selectServer(s.id);
        const btn = li.querySelector("button");
        btn.onclick = () => connectServer(s.id);
        serverListEl.appendChild(li);
      });
    }

    function selectServer(id) {
      selectedServerId = id;
      renderServers();
      loadServerDetail(id);
    }

    async function loadServerDetail(id) {
      const res = await fetch("/api/servers/" + id);
      if (!res.ok) return;
      const detail = await res.json();
      chatStatusEl.textContent = detail.host + ":" + detail.port + " — " + detail.status;
      logEl.innerHTML = "";
      detail.messages.forEach((m) => addLine(m.message, m.timestamp));
      statusLogEl.innerHTML = "";
      detail.statusHistory.forEach((s) => addStatusLine(s.status, s.timestamp));
    }

    async function connectServer(id) {
      const res = await fetch("/api/servers/" + id + "/connect", { method: "POST" });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: res.statusText }));
        if (body.code === "not-logged-in") {
          alert("먼저 로그인 해주세요.");
          accountForm.style.display = "";
          accountForm.querySelector("input[name=email]").focus();
        } else {
          alert("연결 실패: " + body.error);
        }
        return;
      }
      selectServer(id);
    }

    function addLine(text, time) {
      const div = document.createElement("div");
      div.className = "line";
      const t = new Date(time).toLocaleTimeString();
      div.innerHTML = '<span class="time">' + t + '</span>' + escapeHtml(text);
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addStatusLine(text, time) {
      const div = document.createElement("div");
      div.className = "line";
      const t = new Date(time).toLocaleTimeString();
      div.innerHTML = '<span class="time">' + t + '</span>' + escapeHtml(text);
      statusLogEl.appendChild(div);
      statusLogEl.scrollTop = statusLogEl.scrollHeight;
    }

    accountForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(accountForm).entries());
      await fetch("/api/account/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
    });

    addServerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(addServerForm).entries());
      const res = await fetch("/api/servers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: res.statusText }));
        alert("서버 추가 실패: " + body.error);
        return;
      }
      addServerForm.reset();
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!selectedServerId) {
        alert("먼저 서버를 선택/연결하세요.");
        return;
      }
      const input = chatForm.querySelector("input[name=message]");
      const message = input.value.trim();
      if (!message) return;
      const res = await fetch("/api/servers/" + selectedServerId + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: res.statusText }));
        alert("전송 실패: " + body.error);
        return;
      }
      input.value = "";
    });

    const ws = new WebSocket(`ws://${location.host}`);
    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === "account") {
        account = data.account;
        renderAccount();
      } else if (data.type === "servers") {
        servers = data.servers;
        renderServers();
      } else if (data.type === "server-event") {
        const s = servers.find((x) => x.id === data.serverId);
        if (data.payload.type === "status") {
          if (s) {
            s.status = data.payload.status;
            if (data.payload.phase) s.phase = data.payload.phase;
            s.connected = !!data.payload.connected;
          }
          renderServers();
          if (data.serverId === selectedServerId) {
            chatStatusEl.textContent = (s ? s.host + ":" + s.port : "") + " — " + data.payload.status;
            if (data.payload.logged) addStatusLine(data.payload.status, data.payload.timestamp);
          }
        } else if (data.payload.type === "chat" && data.serverId === selectedServerId) {
          addLine(data.payload.message.message, data.payload.message.timestamp);
        }
      }
    };
  </script>
</body>
</html>
