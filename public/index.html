<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>MC Chat Viewer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #eee; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
  #status { color: #9ad; font-size: 0.85rem; margin-bottom: 1rem; }
  #log { max-width: 700px; }
  .line { padding: 0.2rem 0; border-bottom: 1px solid #333; font-size: 0.95rem; }
  .time { color: #888; font-size: 0.8rem; margin-right: 0.5rem; }
</style>
</head>
<body>
  <h1>Minecraft Chat Viewer</h1>
  <div id="status">connecting to dashboard...</div>
  <div id="log"></div>

  <script>
    const log = document.getElementById("log");
    const status = document.getElementById("status");

    function addLine(text, time) {
      const div = document.createElement("div");
      div.className = "line";
      const t = new Date(time).toLocaleTimeString();
      div.innerHTML = '<span class="time">' + t + '</span>' + text;
      log.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    const ws = new WebSocket(`ws://${location.host}`);
    ws.onopen = () => (status.textContent = "connected");
    ws.onclose = () => (status.textContent = "disconnected — refresh to retry");
    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === "history") {
        data.messages.forEach((m) => addLine(m.message, m.timestamp));
      } else if (data.type === "chat") {
        addLine(data.message.message, data.message.timestamp);
      } else if (data.type === "status") {
        status.textContent = data.status;
      }
    };
  </script>
</body>
</html>
